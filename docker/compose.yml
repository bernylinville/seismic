services:
  es8:
    # Perf fixture (see docs/loop/perf.md): up -d && go run ./cmd/perfseed
    # seeds 5k indices + wide mapping + 10k hits; then run the env-gated
    # acceptance: SEISMIC_ES8=http://127.0.0.1:9200 SEISMIC_ES8_USER=elastic
    # SEISMIC_ES8_PASS=... go test ./internal/es/ -run TestPerfAcceptance -v
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.6
    container_name: seismic-es8
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=seismic8test
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - seismic-es8-data:/usr/share/elasticsearch/data
    mem_limit: 1g

  es7:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.29
    container_name: seismic-es7
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9210:9200"
    volumes:
      - seismic-es7-data:/usr/share/elasticsearch/data
    mem_limit: 1g

volumes:
  seismic-es8-data:
  seismic-es7-data:
